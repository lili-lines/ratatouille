# Data for the component carousel (rendered by _includes/component-carousel.html)
# Each entry = one slide. Images live in assets/img/.

- id: teensy
  title: "Teensy 4.0 🧠"
  images:
    - src: teensy.png
      width: "80%"
      caption: 'Details of the 40 input/output signal pins. Source: <a href="https://www.pjrc.com/store/teensy40.html" target="_blank" rel="noopener">pjrc.com</a>'
    - src: teensy_soudure.png
      width: "100%"
      caption: "Before / after soldering the header pins"
  role: "The MCU, runs the code, reads the sensors, 3.3 V logic."
  software: "upload code with Arduino IDE."
  in:
    - "power (VIN ← MP1584 5 V) ⚡"
    - "left whisker (A0 ← AS5600 OUT) ℹ️"
    - "right whisker (A1 ← AS5600 OUT) ℹ️"
    - "gyro (18/SDA & 19/SCL ← MPU-6050) ℹ️"
  out:
    - "motor commands (pins → TB6612FNG) 🎮"
    - "motor A : pin 2 → PWMA / pin 3 → AIN1 / pin 4 → AIN2"
    - "motor B : pin 5 → PWMB / pin 6 → BIN1 / pin 20 → BIN2"
  warn:
    - "3.3 V logic, NOT 5 V tolerant."
    - "Analog-to-Digital Converter (ADC) converts the AS5600 tension into a number = [0:3.3 V] → [0:4095], 12 bits"
  zoom:
    - "the Teensy 4.0 has 2 separate ADCs, so A0 and A1 can be sampled in parallel"

- id: as5600
  title: "AS5600 🧲"
  images:
    - src: as5600.jpg
      width: "90%"
      caption: 'Details input/output pins'
    - src: as56_soudure.png
      width: "100%"
      caption: "Before / after soldering the header pins"
  role: "Magnetic angle sensor. Reads how much the whisker bends."
  in:
    - "power (VCC+ & GND- ← Teensy 3.3 V) ⚡"
    - "magnet angle (diametric magnet above the chip) ℹ️"
    - "sets the counting direction (DIR- ← GND) 🎮"
  out:
      - "angle (OUT → Teensy A0/A1)"
      - "analog min angle = 0°/0V, max angle = VCC V [0:VCC] V) ℹ️"
  warn:
      - "needs a DIAMETRIC magnet (not axial)"
      - "analog OUT is ratiometric: it scales with VCC."
      - "tension OUT = (angle / angle_max) x VCC"
  zoom:
      - "the 360° max is never transmitted: the wire carries only volts, the ADC turns it into a raw number"
      - "for the whisker you don't need degrees, you watch the raw value and its slope"
      - "angle° = (valeur_brute / 4095) x 360°"

- id: gyro
  title: "Gyro / IMU 🧭"
  images:
    - src: gyro_MPU6050-Pinout.png
      width: "90%"
      caption: 'Details input/output pins. Source: <a href="https://components101.com/sensors/mpu6050-module" target="_blank" rel="noopener">components101.com</a>'
    - src: gyro_soudure.png
      width: "100%"
      caption: "Before / after soldering the header pins"
  role: "MPU-6050 / GY-521, 6-axis (gyro + accelerometer). Gives the heading, which way the mouse is facing."
  software: "Wire library (I2C), wake the chip with register 0x6B, read the Z axis on register 0x47."
  in:
    - "VCC & GND ← Teensy 3.3 V ⚡"
    - "the robot's rotation ℹ️"
  out:
    - "I2C → Teensy 18/SDA & 19/SCL, address 0x68, ang speed Z ℹ️"
    - "raw / 131.0 = °/s, on the default ±250 °/s range"
  warn:
    - "I2C only on this module, no SPI"
    - "OUT = SPEED, not an angle: you integrate it yourself, so the error accumulates"
    - "it drifts: even at rest ~-2 °/s, calibrate that bias at startup"
  zoom:
    - "heading += (raw/131.0 - bias) x dt, integrated in the loop"
    - "bias calibration = average N samples at rest, precision ≈ 1/√N, N=200 ≈ 1 s of waiting"

- id: driver
  title: "Driver 🕹️"
  images:
    - src: driver_schema_h.jpg
      width: "100%"
      caption: "TB6612FNG pinout"
    - src: driver_soudure.png
      width: "100%"
      caption: "Before / after soldering the header pins"
  role: "TB6612FNG. Powers and steers the 2 motors from the Teensy's orders."
  in:
    - "speed"
    - " - motor A (PWMA ← Teensy pin 2) 🎮"
    - " - motor B (PWMB ← Teensy pin 5) 🎮"
    - "direction"
    - " - motor A (AIN1 / AIN2 ← Teensy pins 3 / 4) 🎮"
    - " - motor B (BIN1 / BIN2 ← Teensy pins 6 / 20) 🎮"
    - "wake-up (STBY ← Teensy pin 8, HIGH) 🎮"
    - "logic power (VCC ← Teensy 3.3 V) ⚡"
    - "motor power (VM ← battery 7.4 V) ⚡"
  out:
    - "motor A (AO1 / AO2 → motor A) ⚡"
    - "motor B (BO1 / BO2 → motor B) ⚡"
  warn:
    - "STBY must be HIGH, else the driver stays asleep"
    - "common ground GND: Teensy + driver + battery"
    - "VCC = 3.3 V logic, VM = 7.4 V power, don't swap"
  zoom:
    - "power translator: 3.3 V orders in → 7.4 V to the motors out"
    - "AIN1/AIN2 = 1/0 forward, 0/1 reverse, 0/0 stop, 1/1 brake"

- id: mp1584
  title: "MP1584"
  images:
    - src: MP1584-Pinout.jpg
      width: "90%"
  role: "Step-down (buck) converter. Drops the 7.4 V battery to a clean 5 V for the Teensy."
  in:
    - "power (IN+/IN- ← battery 7.4 V) ⚡"
  out:
    - "power (OUT+/OUT- → Teensy VIN, 5 V) ⚡"
  warn:
    - "adjust the trim pot to 5 V with a multimeter BEFORE connecting the Teensy"
    - "default output is random: never plug the Teensy on an unset module"
  zoom:
    - "buck = step-down, stays cool"
    - "unlike a linear regulator that wastes the extra as heat"

- id: PMW3901
  title: "PMW3901"
  images:
    - src: PMW3901_schema.png
      width: "90%"
  role: "Optical flow sensor, plan B for the odometry if the motors had come without encoders. NOT USED in the end: the N20 motors arrived with their hall encoders."
  in:
    - "VCC & GND ← Teensy 3.3 V ⚡"
    - "ground image (through the lens) ℹ️"
  out:
    - "SPI 3.3 V → Teensy, dx & dy displacement ℹ️"
  warn:
    - "needs ≥80 mm above the floor to focus, and ≥100 lux"
  zoom:
    - "seen area = 2 x height x tan(angle/2) = 2 x 80mm x tan(20°) ≈ 58 mm diameter"

- id: motor
  title: "N20 + hall encoder ⚙️"
  images:
    - src: N20-Gear-motor_encoder_pinout_3.jpg
      width: "100%"
      caption: "The 6 pins of the motor + encoder connector"
    - src: motorN20_encoder.jpg
      width: "90%"
      caption: "N20 motor with its encoder"
  role: "N20 gear motor. Turns one wheel, and its hall encoder counts how much it turned."
  in:
    - "motor power M1- & M2+ ← driver AO1/AO2 or BO1/BO2 7.4 V ⚡"
    - "encoder power VCC & GND ← Teensy 3.3 V ⚡"
  out:
    - "torque → wheel ⚡"
    - "C1 = hall A, C2 = hall B, quadrature square wave → Teensy ℹ️"
    - "right motor: C1 → pin 9, C2 → pin 10"
    - "left motor: C1 → pin 11, C2 → pin 12"
  warn:
    - "M1/M2 NEVER go to the Teensy, they carry the 7.4 V from the driver"
    - "power the encoder from 3.3 V: its outputs follow VCC and the Teensy is not 5 V tolerant"
  zoom:
    - "base resolution 7 ppr, but after the gearbox we measured ≈1151 counts per wheel turn"
    - "Ø32 mm wheel ⇔ ~100 mm per turn, so 100/1151 ≈ 0.087 mm per count"
    - "read both channels: one alone only counts, two give the direction"

- id: battery
  title: "battery"
  images:
    - src: battery.jpg
  role: "🚧 : Battery. Powers the robot. 2S = en série, SM 3-pin = power + équilibre"
  in:
    - "power charge yellow (?) (7.4 V Li-ion 2S) ⚡"
  out:
    - "power (7.4 V → MP1584) ⚡"
    - "+ rouge ~ 7.4 V/8.4 V"
    - "- noir ground = GND (0 V)"
    - "yellow = for the charger, no connect to 🐭"
  warn:
  - "prévoir comment recharger la batterie sans la déconnecter du robot"
  - "🚧 todo : explication de ce qu'il faut"
  - "attention à l'explosion 💥"
  - "important pour la charge mettre les couleurs en face, c'est le moment 
    ou on peut se bruler donc attention, une fois les rouges en face des 
    rouges, noir en face des noirs... on branche, si ça fume pas c'est ok"
